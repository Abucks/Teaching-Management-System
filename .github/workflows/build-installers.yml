# ---------------------------------------------------------------------------
# 多系统安装包构建：Windows(MSI + Setup.exe) / macOS(DMG arm64 + x64) / Linux(deb + AppImage)
#
# 触发方式：
#   · 手动：Actions → Build installers → Run workflow
#   · 打标签：push v* 标签 → 构建完成后自动创建/更新 GitHub Release 并上传全部安装包
#
# 产物命名统一为：TeachingManager-<版本>-<系统>-<架构>-<类型>-<UTC时间戳>
#   例：TeachingManager-1.4.0-windows-x64-setup-20260913-1015.exe
# ---------------------------------------------------------------------------
name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # 需要写权限以创建 Release 并上传安装包

jobs:
  # ------------------------------------------------------------- 版本与时间戳
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stamp: ${{ steps.meta.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: 读取版本号与时间戳
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('teaching_manager.py',encoding='utf-8').read()).group(1))")
          # 标签形如 v1.4.0 时以标签为准
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"     >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION  时间戳: $STAMP"

  # ------------------------------------------------------- Windows: exe/MSI/Setup
  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib openpyxl python-docx xlrd pyinstaller

      - name: 构建便携版 exe（PyInstaller onefile）
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TeachingManager `
            --icon packaging/macos/assets/icon.ico `
            --add-data "packaging/macos/assets/icon.png;." `
            teaching_manager.py

      - name: 构建 Setup.exe（Inno Setup）
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" `
                  "/DSourceExe=dist\TeachingManager.exe" `
                  "/DOutputDir=dist\installers" `
                  "/DOutputBase=TeachingManager-${{ needs.meta.outputs.version }}-windows-x64-setup-${{ needs.meta.outputs.stamp }}" `
                  packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: 构建 MSI（WiX Toolset v5）
        shell: pwsh
        run: |
          dotnet tool install --global wix | Out-Null
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          New-Item -ItemType Directory -Force dist\installers | Out-Null
          & $wix build packaging\windows\installer.wxs `
              -d "SourceExe=dist\TeachingManager.exe" `
              -d "AppVersion=${{ needs.meta.outputs.version }}" `
              -o "dist\installers\TeachingManager-${{ needs.meta.outputs.version }}-windows-x64-${{ needs.meta.outputs.stamp }}.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX 构建失败" }

      - name: 重命名便携版（带版本与时间戳）
        shell: pwsh
        run: |
          Copy-Item dist\TeachingManager.exe `
            "dist\installers\TeachingManager-${{ needs.meta.outputs.version }}-windows-x64-portable-${{ needs.meta.outputs.stamp }}.exe"

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist\installers | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist/installers/*
          if-no-files-found: error

  # ------------------------------------------------------------- macOS: DMG
  macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            label: arm64
          - runner: macos-15-intel
            arch: x86_64
            label: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib openpyxl python-docx xlrd pyinstaller

      - name: 构建 .app 与 DMG
        working-directory: packaging/macos
        run: |
          python build_macos.py --skip-deps --arch ${{ matrix.arch }}

      - name: 重命名 DMG（带版本与时间戳）
        working-directory: packaging/macos
        run: |
          mkdir -p ../installers
          SRC=$(ls *.dmg | head -1)
          mv "$SRC" "../installers/TeachingManager-${{ needs.meta.outputs.version }}-macos-${{ matrix.label }}-${{ needs.meta.outputs.stamp }}.dmg"

      - name: 校验 DMG
        working-directory: packaging/installers
        run: |
          ls -lh
          hdiutil verify *.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos-${{ matrix.label }}
          path: packaging/installers/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------- Linux: deb + AppImage
  linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装系统依赖（Qt6 运行库）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xkb1 libxrender1 libxi6 fonts-noto-cjk zsync

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib openpyxl python-docx xlrd pyinstaller

      - name: 构建 onedir 应用（供 deb/AppImage 打包）
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name TeachingManager \
            --add-data "packaging/macos/assets/icon.png:." \
            teaching_manager.py

      - name: 打包 .deb 与 AppImage
        run: |
          chmod +x packaging/linux/build_packages.sh
          bash packaging/linux/build_packages.sh dist/TeachingManager \
               "${{ needs.meta.outputs.version }}" dist/installers

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: dist/installers/*
          if-no-files-found: error

  # ----------------------------------------- 打标签时自动发布 GitHub Release
  release:
    needs: [meta, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 生成 Release 说明
        run: |
          V="${{ needs.meta.outputs.version }}"
          if [ -f "docs/RELEASE_NOTES_v${V}.md" ]; then
            cp "docs/RELEASE_NOTES_v${V}.md" release-body.md
          else
            { echo "## 教学管理系统 v${V}"; echo; echo "构建时间（UTC）：${{ needs.meta.outputs.stamp }}"; echo;
              echo "包含 Windows(MSI/Setup/便携版)、macOS(DMG arm64/x64)、Linux(deb/AppImage) 安装包。";
              echo "详见 [CHANGELOG.md](CHANGELOG.md)。"; } > release-body.md
          fi
          ls -lh assets

      - name: 创建 / 更新 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: TeachingManager ${{ needs.meta.outputs.version }} (${{ needs.meta.outputs.stamp }})
          body_path: release-body.md
          files: assets/*
          fail_on_unmatched_files: false
          make_latest: true
